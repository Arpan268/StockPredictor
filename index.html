<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

        <div id="header">
            <h1>Stock Predictions</h1>
        </div>
        <div id="loadingImg"></div>
        <div id="apimessage"></div>
        <div id="content">
            <p id="label">Add upto 3 stocks below to get a super accurate stock predictions report</p>

            <p id="stockList">Your added stocks will appear here.</p>
            <button id="getReport">GENERATE REPORT</button>
            <p>Real-time market data meets generative AI!</p>
            <p id="disclaimer">For technical demonstration only<br>This is not real financial advice</p>
            <a href="aboutme.html">About the Developer</a>
        </div>
    </div>
    <script type="module" src="index.js"></script>
